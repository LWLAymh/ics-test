name: Deploy ICS Test to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate question bank
        working-directory: question-bank
        run: |
          python -m pip install -r _tools/requirements.txt
          python _tools/validate_cls.py
          python _tools/verify_verbatim.py
          python _tools/verify_curated.py
          python _tools/build_web_data.py

      - name: Check site scripts
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Browser XSS and API safety regression
        env:
          ICS_TEST_URL: http://127.0.0.1:4189/
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
          npx playwright install --with-deps chromium
          python -m http.server 4189 --bind 127.0.0.1 --directory _site >/dev/null 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node tests/browser-security.cjs
          node tests/browser-ai-grader.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
