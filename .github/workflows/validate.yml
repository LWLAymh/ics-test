name: Validate v5 (no deployment)
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r question-bank/_tools/requirements.txt
      - run: npm run compile-bank
      - run: npm run check
      - run: npm run build
      - name: Browser XSS and API safety regression
        env:
          ICS_TEST_URL: http://127.0.0.1:4189/
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
          npx playwright install --with-deps chromium
          python -m http.server 4189 --bind 127.0.0.1 --directory _site >/dev/null 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node tests/browser-security.cjs
          node tests/browser-ai-grader.cjs
      - name: Generated source must be committed
        run: git diff --exit-code -- question-bank/web-data
