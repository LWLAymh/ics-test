name: Validate MCP (no deployment)
on:
  push:
    paths: ['mcp/**', 'scripts/mcp-data.cjs', 'tests/mcp-data.test.cjs', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', 'scripts/mcp-data.cjs', 'tests/mcp-data.test.cjs', '.github/workflows/mcp.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dry-run
